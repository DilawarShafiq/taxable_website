steps:
  # Build the Docker image — Firebase client config baked in at build time
  - name: "gcr.io/cloud-builders/docker"
    id: build
    args:
      - build
      - --tag
      - "us-central1-docker.pkg.dev/taxable-ai-2026/taxable-ai/app:$COMMIT_SHA"
      - --tag
      - "us-central1-docker.pkg.dev/taxable-ai-2026/taxable-ai/app:latest"
      - --build-arg
      - "NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}"
      - --build-arg
      - "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}"
      - --build-arg
      - "NEXT_PUBLIC_FIREBASE_PROJECT_ID=taxable-ai-2026"
      - --build-arg
      - "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}"
      - --build-arg
      - "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}"
      - --build-arg
      - "NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}"
      - --build-arg
      - "NEXT_PUBLIC_SITE_URL=${_SITE_URL}"
      - .

  # Push image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    id: push
    args:
      - push
      - --all-tags
      - "us-central1-docker.pkg.dev/taxable-ai-2026/taxable-ai/app"

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - taxable-ai
      - "--image=us-central1-docker.pkg.dev/taxable-ai-2026/taxable-ai/app:$COMMIT_SHA"
      - "--region=us-central1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--service-account=taxable-ai-app@taxable-ai-2026.iam.gserviceaccount.com"
      - "--add-cloudsql-instances=taxable-ai-2026:us-central1:taxable-ai-db"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=10"
      - "--port=3000"
      - >-
        --set-env-vars=NODE_ENV=production,INSTANCE_UNIX_SOCKET=/cloudsql/taxable-ai-2026:us-central1:taxable-ai-db,DB_NAME=taxable_ai,DB_USER=postgres,DB_PASS=${_DB_PASS},NEXT_PUBLIC_FIREBASE_PROJECT_ID=taxable-ai-2026,ANTHROPIC_VERTEX_PROJECT_ID=taxable-ai-2026,GMAIL_USER=${_GMAIL_USER},GMAIL_APP_PASSWORD=${_GMAIL_APP_PASSWORD},GMAIL_LEADS_EMAIL=${_GMAIL_LEADS_EMAIL}

images:
  - "us-central1-docker.pkg.dev/taxable-ai-2026/taxable-ai/app:$COMMIT_SHA"
  - "us-central1-docker.pkg.dev/taxable-ai-2026/taxable-ai/app:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

substitutions:
  _FIREBASE_API_KEY: "placeholder"
  _FIREBASE_AUTH_DOMAIN: "taxable-ai-2026.firebaseapp.com"
  _FIREBASE_STORAGE_BUCKET: "taxable-ai-2026.appspot.com"
  _FIREBASE_MESSAGING_SENDER_ID: "placeholder"
  _FIREBASE_APP_ID: "placeholder"
  _SITE_URL: "https://taxable.ai"
  _DB_PASS: "TaxableAI2026!Secure"
  _GMAIL_USER: "placeholder@gmail.com"
  _GMAIL_APP_PASSWORD: "placeholder"
  _GMAIL_LEADS_EMAIL: "leads@taxable.ai"
